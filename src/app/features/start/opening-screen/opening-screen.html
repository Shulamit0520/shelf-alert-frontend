<div 
  class="w-full min-h-screen bg-white flex flex-col items-center px-6 pt-16"
  dir="rtl"
>

  <!-- Illustration -->
  <img
    src="assets/vector art.png"
    alt="illustration"
    class="w-64 max-w-[70%] mb-14"
  />

  <!-- Title -->
  <h1 class=" text-[32px] font-extrabold text-[#0B3D17] text-center leading-tight">
    ברוכים הבאים
  </h1>

  <p class="text-[22px] text-[#0B3D17] text-center mt-3 mb-12">
    כיצד תרצו להתחבר?
  </p>

  <!-- Buttons container -->
  <div class="w-full max-w-sm flex flex-col gap-5">

    <!-- Sign In -->
    <button
      pButton
      class="w-full h-14 bg-[#F4F4F4] rounded-full border border-[#DADADA] 
             !rounded-full !p-0 text-[22px] text-[#0B3D17] font-semibold"
      routerLink="/login"
    >
      כניסה לחשבון
    </button>

    <!-- Register -->
    <button
      pButton
      class="w-full h-14 bg-[#F4F4F4] rounded-full border border-[#DADADA] 
             !rounded-full !p-0 text-[22px] text-[#0B3D17] font-semibold"
      routerLink="/register"
    >
      הרשמה לחשבון
    </button>

    <!-- Google -->
    <button
      class="w-full h-14 bg-white rounded-full border border-[#BDBDBD] 
             flex items-center justify-center gap-3 text-[22px] text-[#0B3D17] font-semibold"
    >
      <img src="assets/icons_google.png" class="w-6 h-6" alt="g" />
      התחברות עם גוגל
    </button>

  </div>

  <!-- Guest Login -->
  <p class="text-[20px] text-[#0B3D17] font-medium mt-10 cursor-pointer">
    כניסה ללא משתמש
  </p>

</div>
