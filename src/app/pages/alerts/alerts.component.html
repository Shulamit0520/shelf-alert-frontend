<section class="page alerts">
  <header class="page-header">
    <h2>התראות</h2>
    <p>רשימת התראות אחרונות</p>
  </header>

  <main class="page-main">
    <ul class="alert-list">
      <li *ngFor="let a of alerts" class="alert-item">
        <div class="meta">
          <strong>{{ a.title }}</strong>
          <span class="time">{{ a.time }}</span>
        </div>
        <a class="link" [routerLink]="['/']">פתח</a>
      </li>
    </ul>
  </main>
</section>
